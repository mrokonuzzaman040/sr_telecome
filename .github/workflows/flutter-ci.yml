name: Flutter CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        # Must ship Dart >= 3.9.0 to satisfy `environment: sdk: ^3.9.0` in
        # mobile/pubspec.yaml. Flutter 3.35.x bundles Dart 3.9.x.
        flutter-version: '3.35.1'
        channel: 'stable'
        cache: true
    
    - name: Get dependencies
      working-directory: ./mobile
      run: flutter pub get
    
    - name: Analyze code
      working-directory: ./mobile
      # Errors and warnings still fail the build. Info-level style lints are
      # reported but non-fatal so they cannot block a release on their own.
      run: flutter analyze --no-fatal-infos
    
    - name: Run tests
      working-directory: ./mobile
      run: flutter test
    
    - name: Build APK (Release)
      working-directory: ./mobile
      run: flutter build apk --release
    
    - name: Build APK (Debug)
      working-directory: ./mobile
      run: flutter build apk --debug
    
    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: mobile/build/app/outputs/flutter-apk/app-release.apk
        retention-days: 30
    
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: mobile/build/app/outputs/flutter-apk/app-debug.apk
        retention-days: 7
    
    - name: Create Release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v1
      with:
        files: mobile/build/app/outputs/flutter-apk/app-release.apk
        tag_name: v${{ github.run_number }}
        name: Release v${{ github.run_number }}
        body: |
          ## SR Telecom & Library Mobile App Release
          
          ### Changes
          - Auto-generated release from main branch
          
          ### Installation
          Download the APK and install on your Android device.
          
          ### Version
          Release: v${{ github.run_number }}
          Commit: ${{ github.sha }}
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
